name: Tag on VERSION change

on:
  push:
    branches: [main]
    paths: [VERSION]

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "ver=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate tag availability
        run: |
          ver="v${{ steps.version.outputs.ver }}"
          if git rev-parse "$ver" >/dev/null 2>&1; then
            echo "Tag $ver already exists" >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="v${{ steps.version.outputs.ver }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$ver" -m "$ver"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ver"
