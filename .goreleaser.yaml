version: 2

project_name: triangulate

before:
  hooks:
    - go mod tidy

builds:
  - id: triangulate
    main: ./main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: triangulate
    ids:
      - triangulate
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: triangulate
    package_name: triangulate
    ids:
      - triangulate
    vendor: programmablemike
    homepage: https://github.com/programmablemike/triangulate
    maintainer: programmablemike <pkg-maintainer@programmablemike.com>
    description: CLI tool for identifying a project's root directory by marker file.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

homebrew_casks:
  - name: triangulate
    repository:
      owner: programmablemike
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/programmablemike/triangulate
    description: CLI tool for identifying a project's root directory by marker file.
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^ci:"
      - merge conflict
      - Merge pull request
      - Merge remote-tracking branch
  groups:
    - title: Features
      regexp: "^feat(ure)?(\\(.+\\))?:"
      order: 0
    - title: Bug Fixes
      regexp: "^(fix|bug)"
      order: 1
    - title: Other
      order: 999

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
